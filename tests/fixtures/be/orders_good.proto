syntax = "proto3";

package acme.orders.v1;

option go_package = "github.com/acme/apis/orders/v1;ordersv1";
option java_package = "com.acme.orders.v1";

import "google/protobuf/timestamp.proto";

// Manages orders.
service OrderService {
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc WatchOrders(WatchOrdersRequest) returns (stream WatchOrdersResponse) {}
}

message Order {
  string id = 1;
  OrderStatus status = 2;
  int64 total_minor = 3;
  string currency_code = 4;
  google.protobuf.Timestamp create_time = 5;
  map<string, string> labels = 6;
  oneof payment {
    string card_id = 7;
    string bank_account_id = 8;
  }
  reserved 9, 10;
  reserved "legacy_total";
  message LineItem {
    string sku = 1;
    int32 quantity = 2;
  }
  repeated LineItem line_items = 11;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_PAID = 2;
}

message GetOrderRequest { string id = 1; }
message GetOrderResponse { Order order = 1; }
message ListOrdersRequest { int32 page_size = 1; string page_token = 2; string filter = 3; }
message ListOrdersResponse { repeated Order orders = 1; string next_page_token = 2; }
message WatchOrdersRequest { string filter = 1; }
message WatchOrdersResponse { Order order = 1; }
