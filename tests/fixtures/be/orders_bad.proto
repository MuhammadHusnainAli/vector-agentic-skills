syntax = "proto2";
package acme.orders;

service Orders {
  rpc getOrder(OrderId) returns (Order);
  rpc ListOrders(google.protobuf.Empty) returns (OrderList);
  rpc DeleteOrder(OrderId) returns (google.protobuf.Empty);
}

message OrderId { required string id = 1; }
message Order {
  optional string id = 1;
  optional int64 totalAmount = 2;
  optional Status status = 2;
  reserved 5;
  optional string note = 5;
  optional string trace = 19001;
}
message OrderList { repeated Order orders = 1; }
enum Status { PENDING = 1; PAID = 2; }
