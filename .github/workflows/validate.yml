name: Validate skills

# Pull-request checks. Pushes to main run the same checks inside deploy.yml.
on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate SKILL.md files
        run: python scripts/validate_skills.py
      - name: Generated files are up to date
        run: python scripts/build_catalog.py --check
      - name: Skill scripts pass their smoke tests
        run: python scripts/test_skill_scripts.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agenticskill-portfolio/package-lock.json
      - name: Lint and build website
        working-directory: agenticskill-portfolio
        run: |
          npm ci
          npm run lint
          npm run build
